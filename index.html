<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

  :root {
    --black: #0A0A0A;
    --white: #FFFFFF;
    --gray-soft: #F1F1F1;
    --gray-dark: #1C1C1C;
    --gray-mid: #9B9B9B;
    --line-on-black: rgba(255,255,255,0.14);
    --line-on-white: #E9E9E9;
    --r-card: 26px;
    --r-pill: 999px;
    --r-input: 18px;
    --nav-h: 68px;
    --nav-safe-b: env(safe-area-inset-bottom, 0px);
    --nav-safe-t: env(safe-area-inset-top, 0px);
    --app-vh: 100dvh;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #E5E5E5; font-family: 'Pretendard', -apple-system, sans-serif; overscroll-behavior-y: none; display: flex; align-items: center; justify-content: center; }

  #root {
    width: 100%;
    max-width: 430px;
    min-height: var(--app-vh);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .25s ease;
  }
  @supports (aspect-ratio: 1 / 1) {
    #root { aspect-ratio: 9 / 19.6; min-height: 0; max-height: var(--app-vh); }
  }
  #root.theme-white { background: var(--white); color: var(--black); }
  #root.theme-black { background: var(--black); color: var(--white); }

  .fin-header {
    padding: calc(var(--nav-safe-t) + 16px) 20px 6px;
  }
  .fin-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    border: 1.5px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    background: none; color: inherit; cursor: pointer; flex-shrink: 0;
  }
  .icon-btn.filled { background: currentColor; }
  .icon-btn.filled svg, .icon-btn.filled span { color: var(--bg-color, #fff); }
  .theme-white .icon-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }
  .theme-black .icon-btn.active { background: var(--white); color: var(--black); border-color: var(--white); }
  .fin-title { font-weight: 900; font-size: 24px; letter-spacing: -.02em; text-align: center; }
  .fin-subtitle { font-family: 'Pretendard', sans-serif; font-size: 11px; color: var(--gray-mid); margin-top: 2px; text-align: center; }

  .fin-body { padding: 0 20px 20px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .fin-body.no-scroll { overflow-y: hidden; display: flex; flex-direction: column; gap: 12px; }
  .dash-slot { flex: 1 1 0; min-height: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  .fin-bottom-nav {
    position: sticky; bottom: calc(14px + var(--nav-safe-b));
    margin: 0 22px; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: #141414;
    border-radius: 28px;
    padding: 8px 6px;
    box-shadow: 0 16px 34px rgba(0,0,0,.4);
  }
  .fin-nav-btn {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: rgba(255,255,255,.4);
    padding: 11px 8px; cursor: pointer; transition: color .15s ease;
  }
  .fin-nav-btn.active { color: #fff; }

  /* ---- stat pills (dashboard) ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-pill { border-radius: var(--r-card); padding: 14px 16px; border: 1.5px solid var(--line-on-black); }
  .stat-pill .l { font-size: 11px; color: var(--gray-mid); margin-bottom: 6px; }
  .stat-pill .v { font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 16px; }
  .stat-pill .v.neg { color: #B2B2B2; }

  /* ---- day strip ---- */
  .day-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 14px; margin-bottom: 6px; }
  .day-chip {
    flex: 0 0 auto; width: 46px; height: 68px; border-radius: 18px;
    border: 1.5px solid var(--line-on-black);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    font-size: 11px;
  }
  .day-chip .dow { color: var(--gray-mid); font-size: 10px; }
  .day-chip .num { font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 14px; }
  .day-chip .dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0; }
  .day-chip.has-spend .dot { opacity: .8; }
  .day-chip.today { background: var(--white); color: var(--black); border-color: var(--white); }

  .section-title { font-weight: 700; font-size: 13px; margin: 6px 0 12px; text-transform: uppercase; letter-spacing: .04em; color: inherit; }

  /* ---- timeline ---- */
  .timeline { position: relative; padding-left: 22px; margin-bottom: 8px; }
  .timeline::before { content: ''; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 1.5px; background: var(--line-on-black); }
  .tl-item { position: relative; padding: 10px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .tl-dot { position: absolute; left: -22px; top: 17px; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .tl-main { min-width: 0; }
  .tl-title { font-size: 13.5px; font-weight: 500; }
  .tl-meta { font-size: 11px; color: var(--gray-mid); margin-top: 2px; }
  .tl-amount { font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
  .tl-del { background: none; border: none; color: var(--gray-mid); padding: 4px; cursor: pointer; }

  .highlight-card {
    background: var(--white); color: var(--black);
    border-radius: 20px; padding: 14px 16px; margin: 6px 0 18px 22px;
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
  }
  .highlight-card .tag { display: inline-block; font-size: 9.5px; font-weight: 700; background: var(--gray-soft); color: var(--gray-mid); padding: 3px 8px; border-radius: var(--r-pill); margin-bottom: 8px; }
  .highlight-card .t { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
  .highlight-card .s { font-size: 11.5px; color: var(--gray-mid); }

  /* ---- goal card ---- */
  .goal-card {
    border-radius: var(--r-card); border: 1.5px solid var(--line-on-black);
    padding: 16px; background: rgba(255,255,255,.03);
    height: 100%; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-sizing: border-box; overflow: hidden;
  }
  .theme-white .goal-card { background: rgba(10,10,10,.02); }
  .graph-mid { flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }

  .dash-slot { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ---- sun graph (percentage visual) ---- */
  .sun-wrap {
    position: relative; margin: 4px auto 22px;
    width: 192px; height: 192px;
  }
  .sun-graph { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  .sun-line { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,.22); }
  .theme-white .sun-line { background: rgba(0,0,0,.16); }
  .sun-clip { position: absolute; top: 0; left: 0; right: 0; overflow: hidden; }
  .sun-solid, .sun-glow { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; }
  .sun-solid { background: #fff; }
  .theme-white .sun-solid { background: #0A0A0A; }
  .sun-glow {
    background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,.22) 45%, rgba(255,255,255,0) 72%);
    filter: blur(15px);
  }
  .theme-white .sun-glow {
    background: radial-gradient(circle, rgba(10,10,10,.5) 0%, rgba(10,10,10,.2) 45%, rgba(10,10,10,0) 72%);
  }
  .sun-label { position: absolute; line-height: 1.3; }
  .sun-label-top { top: 2px; left: 2px; text-align: left; }
  .sun-label-bottom { bottom: 2px; right: 2px; text-align: right; }
  .sun-label-bottom-left { bottom: 2px; left: 2px; text-align: left; }
  .sun-pct { font-family: 'Pretendard', sans-serif; font-weight: 700; font-size: 20px; }
  .sun-sub { font-size: 10px; color: var(--gray-mid); margin-top: 1px; text-transform: uppercase; letter-spacing: .04em; }
  .goal-viewport { overflow: hidden; flex: 1 1 0; min-height: 0; width: 100%; }
  .goal-track { display: flex; height: 100%; transition: transform .3s ease; touch-action: pan-y; }
  .goal-slide { flex: 0 0 100%; width: 100%; height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
  .goal-dots { display: flex; justify-content: center; gap: 6px; flex: 0 0 auto; padding-top: 4px; }
  .goal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-on-black); border: none; padding: 0; cursor: pointer; }
  .theme-white .goal-dot { background: var(--line-on-white); }
  .goal-dot.active { background: currentColor; width: 14px; border-radius: 3px; transition: width .2s; }
  .goal-bar-track { background: var(--line-on-black); border-radius: var(--r-pill); height: 10px; overflow: hidden; margin: 10px 0 8px; }
  .theme-white .goal-bar-track { background: var(--gray-soft); }
  .goal-bar-fill { background: currentColor; height: 100%; }
  .goal-meta { font-size: 11px; color: var(--gray-mid); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }

  /* ---- forms (white screens) ---- */
  .field-label { font-size: 11px; font-weight: 700; color: var(--gray-mid); margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
  .field-label:first-child { margin-top: 0; }
  .row-2 { display: flex; gap: 10px; }
  .row-2 > * { flex: 1; min-width: 0; }

  .pill-input-wrap { position: relative; }
  .pill-input {
    width: 100%; border: none; border-radius: var(--r-input);
    padding: 15px 16px; font-family: 'Pretendard', sans-serif; font-size: 14px;
    background: var(--gray-soft); color: var(--black); outline: none;
  }
  .theme-black .pill-input { background: var(--gray-dark); color: var(--white); }
  .pill-input.mono { font-family: 'Pretendard', sans-serif; }
  .pill-input:focus { box-shadow: 0 0 0 2px currentColor; }
  select.pill-input { appearance: none; -webkit-appearance: none; }

  .icon-row {
    display: flex; align-items: center; gap: 12px;
    border-radius: var(--r-input); background: var(--gray-soft);
    padding: 13px 16px; margin-bottom: 10px;
  }
  .theme-black .icon-row { background: var(--gray-dark); }
  .icon-row .ic { width: 22px; height: 22px; border-radius: 50%; background: var(--black); color: var(--white); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .theme-black .icon-row .ic { background: var(--white); color: var(--black); }
  .icon-row input { flex: 1; border: none; background: none; outline: none; font-size: 13.5px; color: inherit; font-family: inherit; }
  .icon-row .amt { font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .icon-row .del { background: none; border: none; color: var(--gray-mid); cursor: pointer; padding: 2px; flex-shrink: 0; }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; margin-top: 6px; }
  .toggle-row .tlabel { display: flex; align-items: center; gap: 10px; font-size: 13.5px; font-weight: 500; }
  .toggle { position: relative; display: inline-block; width: 46px; height: 26px; flex-shrink: 0; }
  .toggle input { display: none; }
  .toggle-track { position: absolute; inset: 0; background: var(--gray-soft); border-radius: var(--r-pill); transition: .2s; }
  .theme-black .toggle-track { background: var(--gray-dark); }
  .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--white); border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: .2s; }
  .theme-black .toggle-thumb { background: var(--black); }
  .toggle input:checked ~ .toggle-track { background: var(--black); }
  .theme-black .toggle input:checked ~ .toggle-track { background: var(--white); }
  .toggle input:checked ~ .toggle-track .toggle-thumb { transform: translateX(20px); background: var(--white); }
  .theme-black .toggle input:checked ~ .toggle-track .toggle-thumb { background: var(--black); }

  .add-btn {
    width: 100%; border: none; border-radius: var(--r-pill);
    padding: 15px; font-size: 14px; font-weight: 700;
    background: var(--black); color: var(--white); cursor: pointer; margin-top: 14px;
  }
  .theme-black .add-btn { background: var(--white); color: var(--black); }
  .add-btn:active { opacity: .8; }

  .empty-note { font-size: 12px; color: var(--gray-mid); padding: 20px 2px; text-align: center; }

  /* ---- calendar ---- */
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .cal-nav .label { font-weight: 700; font-size: 15px; }
  .cal-nav button { background: none; border: none; color: inherit; cursor: pointer; padding: 6px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 10.5px; color: var(--gray-mid); margin-bottom: 6px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 24px; }
  .cal-cell {
    aspect-ratio: 1 / 1; border-radius: 14px; border: 1.5px solid var(--line-on-black);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: none; color: inherit; cursor: pointer; font-family: inherit; padding: 2px;
  }
  .theme-white .cal-cell { border-color: var(--line-on-white); }
  .cal-cell.empty { visibility: hidden; border: none; cursor: default; }
  .cal-cell .d { font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 12.5px; }
  .cal-cell .a { font-size: 8.5px; color: var(--gray-mid); }
  .cal-cell.today { background: var(--white); color: var(--black); border-color: var(--white); }
  .cal-cell.today .a { color: #8A8A8A; }
  .cal-cell.selected:not(.today) { border-color: currentColor; border-width: 2px; }

  .save-toast {
    position: fixed; bottom: calc(80px + var(--nav-safe-b)); left: 50%; transform: translateX(-50%);
    background: var(--black); color: var(--white); font-size: 12px; padding: 8px 16px; border-radius: var(--r-pill);
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30;
  }
  .save-toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="root"></div>

<script>
(function () {
  "use strict";

  // 탭 전환/스크롤 시 iOS Safari 주소창 접힘으로 프레임 크기가 흔들리는 것을 막기 위해
  // 뷰포트 높이를 한 번 고정하고, 실제 화면 크기(회전 등)가 바뀔 때만 갱신한다.
  (function lockAppHeight() {
    var lastWidth = window.innerWidth;
    function apply() {
      var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
      document.documentElement.style.setProperty("--app-vh", h + "px");
    }
    apply();
    window.addEventListener("resize", function () {
      if (window.innerWidth !== lastWidth) {
        lastWidth = window.innerWidth;
        apply();
      }
    });
    window.addEventListener("orientationchange", function () {
      setTimeout(function () {
        lastWidth = window.innerWidth;
        apply();
      }, 300);
    });
  })();

  var STORAGE_KEY = "finance-tracker-standalone-v3";
  var CATEGORIES = ["식비", "교통", "주거/관리비", "통신비", "여가/취미", "의료/건강", "쇼핑", "경조사", "기타"];
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];

  var ICONS = {
    home: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
    calendarBig: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>',
    userBig: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>',
    chevLeft: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    chevRight: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
    navUp: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    navDown: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    navPiggy: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>',
    avatar: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>',
    plus: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>',
    won: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 6l4 13 4-10 4 10 4-13"/><line x1="2" y1="9" x2="22" y2="9"/><line x1="3" y1="12" x2="21" y2="12"/></svg>',
    cal: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>',
    tag: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>',
    note: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/></svg>',
    target: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>'
  };

  var TABS = [
    { key: "income", label: "수입", icon: "navUp" },
    { key: "saving", label: "저축", icon: "navPiggy" },
    { key: "expense", label: "지출", icon: "navDown" }
  ];
  var THEME_MAP = { dashboard: "black", calendar: "black", profile: "white", income: "white", expense: "white", saving: "white" };

  var state = {
    tab: "dashboard",
    calendarMonth: "",
    selectedDate: "",
    goalSlideIndex: 0,
    profile: { annualSalary: "", monthlyNet: "", sideIncomes: [] },
    expenses: [],
    fixedExpenses: [],
    savings: { goals: [] }
  };
  var formFlags = { expFixed: false, savingGoalId: null };

  function migrateSavings(oldSavings) {
    if (!oldSavings) return { goals: [] };
    if (oldSavings.goals) return oldSavings;
    var goals = [];
    if (oldSavings.goalAmount) {
      goals.push({
        id: uid(), label: oldSavings.goalLabel || "저축 목표",
        amount: oldSavings.goalAmount, date: oldSavings.goalDate || "",
        entries: oldSavings.entries || []
      });
    } else if (oldSavings.entries && oldSavings.entries.length) {
      var sum = oldSavings.entries.reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
      goals.push({ id: uid(), label: "저축", amount: sum, date: "", entries: oldSavings.entries });
    }
    return { goals: goals };
  }

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (data.profile) state.profile = data.profile;
        if (data.expenses) state.expenses = data.expenses;
        if (data.fixedExpenses) state.fixedExpenses = data.fixedExpenses;
        if (data.savings) state.savings = data.savings.goals ? data.savings : migrateSavings(data.savings);
        return;
      }
      var v2Raw = localStorage.getItem("finance-tracker-standalone-v2") || localStorage.getItem("finance-tracker-standalone-v1");
      if (v2Raw) {
        var old = JSON.parse(v2Raw);
        if (old.profile) state.profile = old.profile;
        if (old.expenses) state.expenses = old.expenses;
        if (old.fixedExpenses) state.fixedExpenses = old.fixedExpenses;
        state.savings = migrateSavings(old.savings);
      }
    } catch (e) {}
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        profile: state.profile, expenses: state.expenses,
        fixedExpenses: state.fixedExpenses, savings: state.savings
      }));
      showToast();
    } catch (e) { console.error("save failed", e); }
  }

  function showToast() {
    var t = document.getElementById("toast");
    if (!t) return;
    t.classList.add("show");
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(function () { t.classList.remove("show"); }, 900);
  }

  function won(n) { return (Number(n) || 0).toLocaleString("ko-KR") + "원"; }
  function formatComma(v) {
    var digits = String(v == null ? "" : v).replace(/[^0-9]/g, "");
    return digits ? Number(digits).toLocaleString("ko-KR") : "";
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function todayStr() { var d = new Date(); var tz = d.getTimezoneOffset() * 60000; return new Date(d - tz).toISOString().slice(0, 10); }
  function daysUntil(dateStr) {
    if (!dateStr) return null;
    var target = new Date(dateStr + "T00:00:00"), today = new Date(todayStr() + "T00:00:00");
    return Math.round((target - today) / 86400000);
  }
  function monthsUntil(dateStr) {
    if (!dateStr) return null;
    var target = new Date(dateStr + "T00:00:00"), today = new Date(todayStr() + "T00:00:00");
    var months = (target.getFullYear() - today.getFullYear()) * 12 + (target.getMonth() - today.getMonth());
    if (target.getDate() < today.getDate()) months -= 1;
    return Math.max(months, 0);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function computed() {
    var currentMonth = todayStr().slice(0, 7);
    var thisMonthExpenses = state.expenses.filter(function (e) { return e.date && e.date.indexOf(currentMonth) === 0; });
    var totalVariable = thisMonthExpenses.reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
    var totalFixed = state.fixedExpenses.reduce(function (s, f) { return s + Number(f.amount || 0); }, 0);
    var totalExpenseThisMonth = totalVariable + totalFixed;
    var totalSideIncome = state.profile.sideIncomes.reduce(function (s, i) { return s + Number(i.amount || 0); }, 0);
    var totalMonthlyIncome = Number(state.profile.monthlyNet || 0) + totalSideIncome;
    var totalSavings = state.savings.goals.reduce(function (s, g) {
      return s + g.entries.reduce(function (s2, e) { return s2 + Number(e.amount || 0); }, 0);
    }, 0);
    var netBalance = totalMonthlyIncome - totalExpenseThisMonth;
    var goalCards = state.savings.goals.map(function (g) {
      var saved = g.entries.reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
      var amount = Number(g.amount || 0);
      var progress = amount > 0 ? Math.min(100, (saved / amount) * 100) : 0;
      var remaining = Math.max(amount - saved, 0);
      var daysToGoal = daysUntil(g.date);
      var monthsToGoal = monthsUntil(g.date);
      var requiredMonthly = null;
      if (remaining > 0 && monthsToGoal !== null) requiredMonthly = monthsToGoal > 0 ? Math.ceil(remaining / monthsToGoal) : remaining;
      return { id: g.id, label: g.label, amount: amount, date: g.date, saved: saved, progress: progress, remaining: remaining, daysToGoal: daysToGoal, requiredMonthly: requiredMonthly };
    });

    // last 7 days spend map
    var dayTotals = {};
    state.expenses.forEach(function (e) { dayTotals[e.date] = (dayTotals[e.date] || 0) + Number(e.amount || 0); });
    var days = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var iso = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
      days.push({ iso: iso, dow: DOW[d.getDay()], num: d.getDate(), isToday: iso === todayStr(), hasSpend: !!dayTotals[iso] });
    }

    // combined recent timeline
    var events = [];
    state.expenses.forEach(function (e) { events.push({ type: "expense", date: e.date, title: e.category + (e.memo ? " · " + e.memo : ""), amount: -Number(e.amount || 0), id: e.id }); });
    state.savings.goals.forEach(function (g) {
      g.entries.forEach(function (e) { events.push({ type: "saving", date: e.date, title: (e.memo || g.label || "저축"), amount: Number(e.amount || 0), id: e.id }); });
    });
    events.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var recentEvents = events.slice(0, 8);

    var biggestExpense = thisMonthExpenses.slice().sort(function (a, b) { return Number(b.amount) - Number(a.amount); })[0] || null;

    // 이번달 사용 가능 금액 (25일 ~ 익월 24일 기준)
    var period = payPeriod();
    var periodVarExpense = state.expenses
      .filter(function (e) { return e.date >= period.startISO && e.date <= period.endISO; })
      .reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
    var periodSavings = 0;
    state.savings.goals.forEach(function (g) {
      g.entries.forEach(function (e) {
        if (e.date >= period.startISO && e.date <= period.endISO) periodSavings += Number(e.amount || 0);
      });
    });
    var periodBudget = Number(state.profile.monthlyNet || 0) + totalSideIncome;
    var periodUsed = periodVarExpense + totalFixed + periodSavings;
    var periodRemaining = periodBudget - periodUsed;
    var periodPercent = periodBudget > 0 ? Math.min(100, Math.max(0, (periodRemaining / periodBudget) * 100)) : 0;

    return {
      currentMonth: currentMonth, totalFixed: totalFixed, totalExpenseThisMonth: totalExpenseThisMonth,
      totalMonthlyIncome: totalMonthlyIncome, totalSavings: totalSavings, netBalance: netBalance,
      goalCards: goalCards, days: days, recentEvents: recentEvents, biggestExpense: biggestExpense,
      periodBudget: periodBudget, periodUsed: periodUsed, periodRemaining: periodRemaining,
      periodPercent: periodPercent, periodLabel: period.label
    };
  }

  function render() {
    var c = computed();
    var theme = THEME_MAP[state.tab] || "white";
    var root = document.getElementById("root");
    root.className = "theme-" + theme;

    var homeActive = state.tab === "dashboard";
    var calActive = state.tab === "calendar";
    var userActive = state.tab === "profile";
    root.innerHTML =
      '<div class="fin-header">' +
        '<div class="fin-header-row">' +
          '<button class="icon-btn' + (homeActive ? ' active' : '') + '" id="btn-home">' + ICONS.home + '</button>' +
          '<div style="display:flex;gap:10px">' +
            '<button class="icon-btn' + (calActive ? ' active' : '') + '" id="btn-calendar">' + ICONS.calendarBig + '</button>' +
            '<button class="icon-btn' + (userActive ? ' active' : '') + '" id="btn-user">' + ICONS.userBig + '</button>' +
          '</div>' +
        '</div>' +
        headerTitle(c) +
      '</div>' +
      '<div class="fin-body' + (state.tab === "dashboard" ? " no-scroll" : "") + '" id="fin-body">' + tabContent(c) + '</div>' +
      '<div class="fin-bottom-nav">' +
        TABS.map(function (t) {
          var active = state.tab === t.key;
          return '<button class="fin-nav-btn' + (active ? ' active' : '') + '" data-tab="' + t.key + '">' +
            ICONS[t.icon] + '</button>';
        }).join("") +
      '</div>' +
      '<div class="save-toast" id="toast">저장됨</div>';

    bindEvents(c);
  }

  function headerTitle(c) {
    var titles = { dashboard: "", income: "수입 추가", expense: "지출 추가", saving: "저축 입금", calendar: "지출 캘린더", profile: "프로필 설정" };
    var subs = { dashboard: "", income: "부수입 항목 관리", expense: "고정 지출과 변동 지출", saving: "목표를 선택하고 입금액을 기록해요", calendar: "", profile: "기본 소득과 저축 목표" };
    var title = titles[state.tab];
    var sub = subs[state.tab];
    if (!title && !sub) return "";
    return '<div style="margin-bottom:16px">' +
      (title ? '<div class="fin-title">' + title + '</div>' : '') +
      (sub ? '<div class="fin-subtitle">' + sub + '</div>' : '') + '</div>';
  }

  function tabContent(c) {
    if (state.tab === "dashboard") return dashboardTab(c);
    if (state.tab === "income") return incomeTab();
    if (state.tab === "expense") return expenseTab();
    if (state.tab === "saving") return savingTab(c);
    if (state.tab === "calendar") return calendarTab();
    if (state.tab === "profile") return profileTab();
    return "";
  }

  function dashboardTab(c) {
    var budgetSection = budgetCard(c);
    var goalSection = goalCarousel(c);

      '<div class="dash-slot">' + goalSection + '</div>';

  function budgetCard(c) {
    if (!c.periodBudget) {
      return '<div class="goal-card" style="text-align:center">' +
        '<div class="empty-note">사용자 아이콘에서 기본 소득(월 실수령액)을 설정하면 이번달 사용 가능 금액을 볼 수 있어요.</div></div>';

      '<div style="font-size:10.5px;color:var(--gray-mid)">' + c.periodLabel + '</div>' +

  function goalCarousel(c) {

      return '<div class="goal-card" style="text-align:center">' +
        '<div class="empty-note">아직 저축 목표가 없어요. 사용자 아이콘에서 목표를 추가해보세요.</div></div>';
    }
    if (state.goalSlideIndex >= c.goalCards.length) state.goalSlideIndex = c.goalCards.length - 1;
    if (state.goalSlideIndex < 0) state.goalSlideIndex = 0;

    var slides = c.goalCards.map(function (g) {
      return '<div class="goal-slide"><div class="goal-card" style="text-align:center">' +
        '<div style="font-weight:700;font-size:14px">' + esc(g.label || "저축 목표") + '</div>' +
        '<div class="graph-mid">' + sunGraph(g.progress) + '</div>' +
        '<div style="font-family:\'Pretendard\',sans-serif;font-size:12.5px;color:var(--gray-mid);margin-bottom:6px">' +
          won(g.saved) + ' / ' + won(g.amount) +
        '</div>' +
        (g.requiredMonthly !== null ? '<div style="font-size:11px;color:var(--gray-mid);margin-top:6px">매월 약 ' + won(g.requiredMonthly) + '씩 저축하면 목표를 채울 수 있어요.</div>' : '') +

    var dots = c.goalCards.length > 1
      ? '<div class="goal-dots">' + c.goalCards.map(function (g, i) {

    return '<div class="goal-viewport" id="goal-viewport">' +
      '<div class="goal-track" style="' + trackStyle + '">' + slides + '</div>' +
    '</div>' + dots;

  function statPill(label, value, neg) {

        '<div class="row-2" style="margin-bottom:10px">' +

      '<div class="field-label">변동 지출 내역</div>' + varList;

  function savingTab(c) {
    if (state.savings.goals.length === 0) {
      return '<div class="empty-note">아직 저축 목표가 없어요. 상단 사용자 아이콘에서 먼저 목표를 추가해주세요.</div>';

      '<div class="field-label">입금 기록 추가</div>' +
      '<div class="row-2" style="margin-bottom:10px">' +
        '<input class="pill-input" id="saving-date" type="date" value="' + todayStr() + '">' +
        '<input class="pill-input mono money-input" id="saving-amount" type="text" inputmode="numeric" placeholder="금액">' +
      '</div>' +
      '<input class="pill-input" id="saving-memo" placeholder="메모 (선택)" style="margin-bottom:10px">' +
      '<button class="add-btn" id="btn-add-saving">' + ICONS.plus + ' &nbsp;입금 기록 추가</button>' +
      '<div class="field-label">입금 내역</div>' + entryList;

  function profileTab() {
    var goalList = state.savings.goals.length === 0
      ? '<div class="empty-note">등록된 목표가 없어요.</div>'
      : state.savings.goals.map(function (g) {
          var saved = g.entries.reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
          return '<div class="icon-row"><div class="ic">' + ICONS.target + '</div>' +
            '<input value="' + esc(g.label) + (g.date ? ' · ' + g.date : '') + '" readonly>' +
            '<div class="amt">' + won(saved) + ' / ' + won(g.amount) + '</div>' +
            '<button class="del" data-del-goal="' + g.id + '">' + ICONS.trash + '</button></div>';
        }).join("");

    return '<div class="field-label">기본 소득</div>' +
      '<div class="row-2" style="margin-bottom:10px">' +
        '<input class="pill-input mono money-input" id="in-annual" type="text" inputmode="numeric" placeholder="연봉 (원)" value="' + formatComma(state.profile.annualSalary) + '">' +
        '<input class="pill-input mono money-input" id="in-net" type="text" inputmode="numeric" placeholder="월 실수령액 (원)" value="' + formatComma(state.profile.monthlyNet) + '">' +
      '</div>' +
      '<button class="add-btn" id="btn-save-income">기본 소득 저장</button>' +
      '<div class="field-label">저축 목표 추가</div>' +
      '<input class="pill-input" id="goal-label" placeholder="목표 이름 (내 집 마련, 여행자금 등)" style="margin-bottom:10px">' +
      '<div class="row-2" style="margin-bottom:10px">' +
        '<input class="pill-input mono money-input" id="goal-amount" type="text" inputmode="numeric" placeholder="목표 금액">' +
        '<input class="pill-input" id="goal-date" type="date">' +
      '</div>' +
      '<button class="add-btn" id="btn-add-goal">' + ICONS.plus + ' &nbsp;목표 추가</button>' +
      '<div class="field-label">등록된 목표</div>' + goalList;

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function compactWon(n) {
    n = Number(n) || 0;
    if (n === 0) return "";
    if (n >= 10000) return (Math.round(n / 1000) / 10) + "만";
    return n.toLocaleString("ko-KR");
  }

  function sunGraph(percent, topLabel, bottomLabel) {
    var pct = Math.min(Math.max(percent, 0), 100);
    var comp = 100 - pct;
    var FRAME = 192, D = 158;
    var circleTop = (FRAME - D) / 2;
    var lineY = circleTop + D * (pct / 100);
    var labelsHtml = "";
    if (bottomLabel) {
      labelsHtml =
        '<div class="sun-label sun-label-top">' +
          '<div class="sun-pct">' + pct.toFixed(0) + '%</div>' +
          '<div class="sun-sub">' + topLabel + '</div>' +
        '</div>' +
        '<div class="sun-label sun-label-bottom">' +
          '<div class="sun-pct">' + comp.toFixed(0) + '%</div>' +
          '<div class="sun-sub">' + bottomLabel + '</div>' +
        '</div>';
    } else if (topLabel) {
      labelsHtml =
        '<div class="sun-label sun-label-bottom-left">' +
          '<div class="sun-pct">' + pct.toFixed(0) + '%</div>' +
          '<div class="sun-sub">' + topLabel + '</div>' +
        '</div>';
    }
    return '<div class="sun-wrap">' +
      '<div class="sun-graph">' +
        '<div class="sun-glow" style="width:' + D + 'px;height:' + D + 'px;top:' + circleTop + 'px"></div>' +
        '<div class="sun-clip" style="height:' + lineY + 'px">' +
          '<div class="sun-solid" style="width:' + D + 'px;height:' + D + 'px;top:' + circleTop + 'px"></div>' +
        '</div>' +
        '<div class="sun-line" style="top:' + lineY + 'px"></div>' +
      '</div>' +
      labelsHtml +
    '</div>';
  }

  function payPeriod() {
    var t = new Date(todayStr() + "T00:00:00");
    var y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
    var startY, startM, endY, endM;
    if (d >= 25) {
      startY = y; startM = m;
      endM = (m + 1) % 12; endY = (m === 11) ? y + 1 : y;
    } else {
      startM = (m === 0) ? 11 : m - 1; startY = (m === 0) ? y - 1 : y;
      endM = m; endY = y;
    }
    var start = new Date(startY, startM, 25);
    var end = new Date(endY, endM, 24);
    function iso(dt) { var tz = dt.getTimezoneOffset() * 60000; return new Date(dt - tz).toISOString().slice(0, 10); }
    function lbl(dt) { return (dt.getMonth() + 1) + "월 " + dt.getDate() + "일"; }
    return { startISO: iso(start), endISO: iso(end), label: lbl(start) + " ~ " + lbl(end) };
  }

  function calendarTab() {
    if (!state.calendarMonth) state.calendarMonth = todayStr().slice(0, 7);
    if (!state.selectedDate) state.selectedDate = todayStr();

    var ym = state.calendarMonth;
    var year = parseInt(ym.slice(0, 4), 10), month = parseInt(ym.slice(5, 7), 10);
    var firstDow = new Date(year, month - 1, 1).getDay();
    var daysInMonth = new Date(year, month, 0).getDate();

    var dayTotals = {};
    state.expenses.forEach(function (e) {
      if (e.date && e.date.indexOf(ym) === 0) dayTotals[e.date] = (dayTotals[e.date] || 0) + Number(e.amount || 0);
    });

    var cells = "";
    for (var i = 0; i < firstDow; i++) cells += '<div class="cal-cell empty"></div>';
    for (var d = 1; d <= daysInMonth; d++) {
      var iso = ym + "-" + pad2(d);
      var amt = dayTotals[iso] || 0;
      var cls = "cal-cell";
      if (iso === todayStr()) cls += " today";
      if (iso === state.selectedDate) cls += " selected";
      cells += '<button class="' + cls + '" data-cal-date="' + iso + '">' +
        '<span class="d">' + d + '</span>' +
        '<span class="a">' + (amt ? compactWon(amt) : "") + '</span></button>';
    }

    var dayExpenses = state.expenses.filter(function (e) { return e.date === state.selectedDate; });
    var dayTotal = dayExpenses.reduce(function (s, e) { return s + Number(e.amount || 0); }, 0);
    var dayList = dayExpenses.length === 0
      ? '<div class="empty-note">선택한 날짜의 지출 기록이 없어요.</div>'
      : dayExpenses.map(function (e) {
          return '<div class="tl-item"><span class="tl-dot"></span>' +
            '<div class="tl-main"><div class="tl-title">' + esc(e.category) + (e.memo ? ' · ' + esc(e.memo) : '') + '</div></div>' +
            '<div class="tl-amount">-' + won(e.amount) + '</div></div>';
        }).join("");

    return '<div class="cal-nav">' +
        '<button data-cal-prev>' + ICONS.chevLeft + '</button>' +
        '<div class="label">' + year + '년 ' + month + '월</div>' +
        '<button data-cal-next>' + ICONS.chevRight + '</button>' +
      '</div>' +
      '<div class="cal-weekdays">' + DOW.map(function (w) { return '<div>' + w + '</div>'; }).join("") + '</div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="section-title">' + state.selectedDate + ' 지출 (' + won(dayTotal) + ')</div>' +
      '<div class="timeline">' + dayList + '</div>';
  }

  function bindEvents(c) {
    document.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () { state.tab = btn.getAttribute("data-tab"); render(); });
    });
    var viewport = document.getElementById("goal-viewport");
    if (viewport) {
      var touchStartX = null;
      viewport.addEventListener("touchstart", function (e) { touchStartX = e.touches[0].clientX; }, { passive: true });
      viewport.addEventListener("touchend", function (e) {
        if (touchStartX === null) return;
        var dx = e.changedTouches[0].clientX - touchStartX;
        touchStartX = null;
        if (Math.abs(dx) < 40) return;
        var maxIdx = c.goalCards.length - 1;
        if (dx < 0 && state.goalSlideIndex < maxIdx) state.goalSlideIndex++;
        if (dx > 0 && state.goalSlideIndex > 0) state.goalSlideIndex--;
        render();
      });
    }
    document.querySelectorAll("[data-goal-dot]").forEach(function (dot) {
      dot.addEventListener("click", function () {
        state.goalSlideIndex = parseInt(dot.getAttribute("data-goal-dot"), 10);
        render();
      });
    });

    var homeBtn = document.getElementById("btn-home");
    if (homeBtn) homeBtn.addEventListener("click", function () { state.tab = "dashboard"; render(); });
    var calBtn = document.getElementById("btn-calendar");
    if (calBtn) calBtn.addEventListener("click", function () { state.tab = "calendar"; render(); });
    var userBtn = document.getElementById("btn-user");
    if (userBtn) userBtn.addEventListener("click", function () { state.tab = "profile"; render(); });

    var byId = function (id) { return document.getElementById(id); };

    var prevBtn = document.querySelector("[data-cal-prev]");
    if (prevBtn) prevBtn.addEventListener("click", function () {
      var y = parseInt(state.calendarMonth.slice(0, 4), 10), m = parseInt(state.calendarMonth.slice(5, 7), 10);
      m -= 1; if (m < 1) { m = 12; y -= 1; }
      state.calendarMonth = y + "-" + pad2(m);
      render();
    });
    var nextBtn = document.querySelector("[data-cal-next]");
    if (nextBtn) nextBtn.addEventListener("click", function () {
      var y = parseInt(state.calendarMonth.slice(0, 4), 10), m = parseInt(state.calendarMonth.slice(5, 7), 10);
      m += 1; if (m > 12) { m = 1; y += 1; }
      state.calendarMonth = y + "-" + pad2(m);
      render();
    });
    document.querySelectorAll("[data-cal-date]").forEach(function (b) {
      b.addEventListener("click", function () {
        state.selectedDate = b.getAttribute("data-cal-date");
        render();
      });
    });

    if (byId("btn-save-income")) byId("btn-save-income").addEventListener("click", function () {
      state.profile.annualSalary = byId("in-annual").value.replace(/,/g, "");
      state.profile.monthlyNet = byId("in-net").value.replace(/,/g, "");
      save(); render();
    });
    if (byId("btn-add-side")) byId("btn-add-side").addEventListener("click", function () {
      var label = byId("side-label").value.trim(), amount = byId("side-amount").value.replace(/,/g, "");
      if (!label || !amount) return;
      state.profile.sideIncomes.push({ id: uid(), label: label, amount: amount });
      save(); render();
    });
    document.querySelectorAll("[data-del-side]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del-side");
        state.profile.sideIncomes = state.profile.sideIncomes.filter(function (i) { return i.id !== id; });
        save(); render();
      });
    });

    var fixedToggle = byId("exp-fixed-toggle");
    if (fixedToggle) fixedToggle.addEventListener("change", function () { formFlags.expFixed = fixedToggle.checked; render(); });

    if (byId("btn-add-exp")) byId("btn-add-exp").addEventListener("click", function () {
      if (formFlags.expFixed) {
        var label = byId("fixed-label").value.trim(), amt = byId("fixed-amount").value.replace(/,/g, "");
        if (!label || !amt) return;
        state.fixedExpenses.push({ id: uid(), label: label, amount: amt });
      } else {
        var amount = byId("exp-amount").value.replace(/,/g, "");
        if (!amount) return;
        state.expenses.unshift({ id: uid(), date: byId("exp-date").value || todayStr(), category: byId("exp-cat").value, amount: amount, memo: byId("exp-memo").value.trim() });
      }
      formFlags.expFixed = false;
      save(); render();
    });
    document.querySelectorAll("[data-del-fixed]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del-fixed");
        state.fixedExpenses = state.fixedExpenses.filter(function (f) { return f.id !== id; });
        save(); render();
      });
    });
    document.querySelectorAll("[data-del-exp]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del-exp");
        state.expenses = state.expenses.filter(function (e) { return e.id !== id; });
        save(); render();
      });
    });

    if (byId("btn-add-goal")) byId("btn-add-goal").addEventListener("click", function () {
      var label = byId("goal-label").value.trim();
      var amount = byId("goal-amount").value.replace(/,/g, "");
      var date = byId("goal-date").value;
      if (!label || !amount) return;
      state.savings.goals.push({ id: uid(), label: label, amount: amount, date: date, entries: [] });
      save(); render();
    });
    document.querySelectorAll("[data-del-goal]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-del-goal");
        state.savings.goals = state.savings.goals.filter(function (g) { return g.id !== id; });
        save(); render();
      });
    });

    var savingGoalSel = byId("saving-goal");
    if (savingGoalSel) savingGoalSel.addEventListener("change", function () { formFlags.savingGoalId = savingGoalSel.value; });

    if (byId("btn-add-saving")) byId("btn-add-saving").addEventListener("click", function () {
      var amount = byId("saving-amount").value.replace(/,/g, "");
      var goalId = byId("saving-goal").value;
      if (!amount || !goalId) return;
      var goal = state.savings.goals.filter(function (g) { return g.id === goalId; })[0];
      if (!goal) return;
      goal.entries.unshift({ id: uid(), date: byId("saving-date").value || todayStr(), amount: amount, memo: byId("saving-memo").value.trim() });
      save(); render();
    });
    document.querySelectorAll("[data-del-saving]").forEach(function (b) {
      b.addEventListener("click", function () {
        var parts = b.getAttribute("data-del-saving").split("|");
        var goal = state.savings.goals.filter(function (g) { return g.id === parts[0]; })[0];
        if (goal) goal.entries = goal.entries.filter(function (e) { return e.id !== parts[1]; });
        save(); render();
      });
    });
  }

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains("money-input")) return;
    var selStart = t.selectionStart == null ? t.value.length : t.selectionStart;
    var digitsBeforeCursor = t.value.slice(0, selStart).replace(/[^0-9]/g, "").length;
    var raw = t.value.replace(/[^0-9]/g, "");
    var formatted = raw ? Number(raw).toLocaleString("ko-KR") : "";
    t.value = formatted;
    var pos = 0, count = 0;
    while (pos < formatted.length && count < digitsBeforeCursor) {
      if (/[0-9]/.test(formatted[pos])) count++;
      pos++;
    }
    try { t.setSelectionRange(pos, pos); } catch (err) {}
  });

  load();
  render();
})();
</script>
</body>
</html>
